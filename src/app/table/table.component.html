<div class="table-container">
  <table class="custom-scroll">
    <tr>
      <th *ngFor="let col of columnReference" ngClass="{{col.columnWidth}}">{{col.columnHeader}}
        <img *ngIf="col.filterIcon" (click)="openFilterPanel(getColumnHeader(col.columnHeader))" class="menu--column" src="assets/icons/hamburger.svg" alt="Menu">
      </th>
    </tr>
    <tr *ngFor="let item of tableData">
      <td class="justify-center">{{ item.id }}</td>
      <td>{{ item.company }}</td>
      <td>{{ item.contact }}</td>
      <td>{{ item.country }}</td>
    </tr>
  </table>
</div>
<div *ngIf="filterPanel" class="filter--panel">
  <label class="filter--label" for="column">Filter Panel</label>
  <select name="Operator">
    <option value="" disabled selected>Filter Type</option>
    <option value="Contains">Contains</option>
    <option value="Equal">Equal</option>
    <option value="Not Equal">Not Equal</option>
    <option value="Includes">Includes</option>
  </select>
  <input class="filter--search" placeholder="Filter Input" type="text" name="Search" id="filterSearch" >

  <input class="filter--search--button" type="button" value="Apply" id="filterSearchButton">
</div>
